name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and upload (leave empty for build only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  starter:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - name: Record release identity
        id: identity
        shell: pwsh
        run: |
          $version = (Get-Content packaging/starter-inputs.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Starter version must use major.minor.patch without leading zeroes.'
          }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the checked-out commit.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download pinned Starter build inputs
        shell: pwsh
        run: |
          $starter = $PWD.Path
          $archives = Get-Content (Join-Path $starter 'docs/baseline-evidence/baseline-archives.json') -Raw | ConvertFrom-Json
          $downloadDir = Join-Path $starter 'downloads/baseline'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          foreach ($archive in $archives) {
            $path = Join-Path $downloadDir $archive.filename
            Invoke-WebRequest -Uri $archive.url -OutFile $path
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $archive.sha256) {
              throw "Starter archive checksum mismatch: $($archive.filename)"
            }
          }

          $inputs = Get-Content (Join-Path $starter 'packaging/starter-inputs.json') -Raw | ConvertFrom-Json
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $inputs.compiler.installer_sha256) {
            throw 'Inno Setup installer checksum mismatch.'
          }
          $compilerDir = Join-Path $starter 'tools/vendor/innosetup-6.7.3'
          $installation = Start-Process -FilePath $installer -ArgumentList @(
            '/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT',
            '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $compilerDir + '"')
          ) -Wait -PassThru -WindowStyle Hidden
          if ($installation.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($installation.ExitCode)."
          }
          $compiler = Join-Path $compilerDir 'ISCC.exe'
          if (-not (Test-Path $compiler -PathType Leaf) -or
              (Get-FileHash $compiler -Algorithm SHA256).Hash.ToLowerInvariant() -ne $inputs.compiler.sha256) {
            throw 'Inno Setup compiler checksum mismatch.'
          }

      - name: Run Starter offline tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_build.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./client-helper/build.ps1 -Output build/ci-client-helper-tests -Test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Starter
        shell: pwsh
        run: |
          python scripts/build.py --output build/ci-starter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inputs = Get-Content packaging/starter-inputs.json -Raw | ConvertFrom-Json
          $built = "build/ci-starter/dist/Q2JUMP-Starter-$($inputs.version)-setup.exe"
          if (-not (Test-Path $built -PathType Leaf)) { throw 'Starter build did not produce Setup.' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath $built -Destination artifacts/q2jump-starter.exe
          if ((Get-FileHash $built -Algorithm SHA256).Hash -ne
              (Get-FileHash artifacts/q2jump-starter.exe -Algorithm SHA256).Hash) {
            throw 'Renamed Starter differs from the tested build.'
          }
          $digest = (Get-FileHash artifacts/q2jump-starter.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path artifacts/q2jump-starter.exe.sha256 -Value ($digest + '  q2jump-starter.exe') -Encoding ascii

      - name: Upload Starter artifact
        uses: actions/upload-artifact@v7
        with:
          retention-days: 14
          path: artifacts/q2jump-starter.exe
          archive: false
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: starter
    runs-on: ubuntu-latest
    concurrency:
      group: starter-release-${{ github.event.release.tag_name || inputs.release_tag || format('v{0}', needs.starter.outputs.version) }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download Starter executable
        uses: actions/download-artifact@v8
        with:
          name: q2jump-starter.exe
          path: release

      - name: Publish new Starter version
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        env:
          STARTER_VERSION: ${{ needs.starter.outputs.version }}
          STARTER_COMMIT: ${{ needs.starter.outputs.commit }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const repo = context.repo;
            const version = process.env.STARTER_VERSION;
            const commit = process.env.STARTER_COMMIT;
            const tag = `v${version}`;
            const marker = `<!-- starter-build:${commit} -->`;
            const name = 'q2jump-starter.exe';
            const main = await github.rest.git.getRef({ ...repo, ref: 'heads/main' });
            if (main.data.object.sha !== commit) {
              core.info('Skipping automatic release: main has advanced beyond this build.');
              return;
            }
            // Listing includes drafts, so an interrupted upload can be resumed.
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            let release = releases.find(item => item.tag_name === tag);
            if (release && (!release.draft || release.target_commitish !== commit || !release.body?.includes(marker))) {
              core.info(`${tag} already exists; leaving it unchanged.`);
              return;
            }
            let reference;
            try {
              reference = (await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (reference && (reference.object.type !== 'commit' || reference.object.sha !== commit)) {
              throw new Error(`${tag} already points elsewhere; automatic releases never move existing tags.`);
            }
            const data = fs.readFileSync(`release/${name}`);
            const digest = `sha256:${crypto.createHash('sha256').update(data).digest('hex')}`;
            if (!release) {
              release = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: commit,
                name: `Q2JUMP Starter ${version}`, draft: true,
                body: `Download and run \`${name}\` to install or update your selected clients.\n\n${marker}`,
                generate_release_notes: true
              })).data;
            }
            const existing = release.assets.find(asset => asset.name === name);
            if (!existing || existing.state !== 'uploaded' || existing.size !== data.length || existing.digest !== digest) {
              if (existing) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: existing.id });
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
              });
            }
            await github.rest.repos.updateRelease({
              ...repo, release_id: release.id, draft: false, make_latest: 'legacy'
            });
            core.info(`Published ${tag} from ${commit}.`);

      - name: Upload Starter executable to release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job downloads an artifact without checking out the repository.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release/q2jump-starter.exe --clobber
